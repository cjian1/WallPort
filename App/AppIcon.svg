<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.3" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.75" cy="0.7" r="0.65">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7BC4"/>
      <stop offset="1" stop-color="#5D68C0"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D68C0"/>
      <stop offset="1" stop-color="#7A6AC4"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A6AC4"/>
      <stop offset="1" stop-color="#9B6BBE"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B6BBE"/>
      <stop offset="1" stop-color="#BC6BAE"/>
    </linearGradient>

    <filter id="s1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="s2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="s3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="s4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <clipPath id="iconClip">
      <rect x="36" y="36" width="440" height="440" rx="100"/>
    </clipPath>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bg)"/>

  <g clip-path="url(#iconClip)">
    <rect x="36" y="36" width="440" height="440" fill="url(#glowA)"/>
    <rect x="36" y="36" width="440" height="440" fill="url(#glowB)"/>
    <rect x="36" y="36" width="440" height="440" fill="url(#glowC)"/>

    <!-- 整组卡片向右上平移 (6, -8)，往左修正一点 -->
    <g transform="translate(6 -8)">

      <!-- 第 4 张（最底） -->
      <g transform="rotate(-6 256 256)" filter="url(#s4)">
        <rect x="98" y="175" width="270" height="182" rx="24" fill="url(#c4)"/>
        <circle cx="135" cy="212" r="2" fill="#fff" opacity="0.6"/>
        <circle cx="340" cy="228" r="1.6" fill="#fff" opacity="0.45"/>
      </g>

      <!-- 第 3 张 -->
      <g transform="rotate(-2 256 256)" filter="url(#s3)">
        <rect x="108" y="170" width="278" height="188" rx="25" fill="url(#c3)"/>
        <circle cx="146" cy="207" r="2" fill="#fff" opacity="0.65"/>
        <circle cx="345" cy="224" r="1.6" fill="#fff" opacity="0.5"/>
        <circle cx="190" cy="330" r="1.6" fill="#fff" opacity="0.45"/>
      </g>

      <!-- 第 2 张 -->
      <g transform="rotate(2 256 256)" filter="url(#s2)">
        <rect x="118" y="164" width="286" height="194" rx="26" fill="url(#c2)"/>
        <circle cx="155" cy="202" r="2.2" fill="#fff" opacity="0.7"/>
        <circle cx="352" cy="218" r="1.6" fill="#fff" opacity="0.5"/>
        <circle cx="195" cy="330" r="1.6" fill="#fff" opacity="0.5"/>
        <circle cx="342" cy="320" r="1.4" fill="#fff" opacity="0.4"/>
      </g>

      <!-- 第 1 张（最顶） -->
      <g transform="rotate(6 256 256)" filter="url(#s1)">
        <rect x="128" y="158" width="294" height="200" rx="27" fill="url(#c1)"/>

        <!-- 月亮 -->
        <circle cx="368" cy="204" r="11" fill="#fff" opacity="0.85"/>
        <circle cx="364" cy="201" r="9" fill="url(#c1)" opacity="0.9"/>

        <!-- 星星 -->
        <circle cx="168" cy="214" r="2.2" fill="#fff" opacity="0.8"/>
        <circle cx="208" cy="248" r="1.5" fill="#fff" opacity="0.6"/>
        <circle cx="315" cy="318" r="1.8" fill="#fff" opacity="0.65"/>
        <circle cx="178" cy="320" r="1.5" fill="#fff" opacity="0.55"/>
        <circle cx="262" cy="194" r="1.3" fill="#fff" opacity="0.5"/>
      </g>

    </g>
  </g>
</svg>